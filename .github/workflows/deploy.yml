name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ] # 当推送到 main 分支时触发

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      # 1. 新增：安装 pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.2 # 建议指定与你本地一致的 pnpm 版本

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          # 2. 修改：将缓存改
